shell=/usr/bin/zsh
pad=15x15

[colors-dark]
alpha=0.80
background=1a1b26
foreground=e2f0e2

regular0=32344a  # black
regular1=f7768e  # red
regular2=b9dd25  # green
regular3=e0af68  # yellow
regular4=7aa2f7  # blue
regular5=ad8ee6  # magenta
regular6=0db9d7  # cyan
regular7=e2f0e2  # white 

bright0=444b6a   # bright black
bright1=f7768e   # bright red
bright2=b9dd25   # bright green
bright3=e0af68   # bright yellow
bright4=7aa2f7   # bright blue
bright5=ad8ee6   # bright magenta
